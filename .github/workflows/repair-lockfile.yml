name: Repair npm lockfile

on:
  push:
    paths:
      - ".github/workflows/repair-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: repair-npm-lockfile
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean lockfile installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate application
        run: |
          npm run lint
          npm test
          npm run build

      - name: Switch workflows to deterministic npm ci
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (".github/workflows/ci.yml", ".github/workflows/deploy.yml"):
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  "run: npm install --ignore-scripts --no-audit --no-fund",
                  "run: npm ci --ignore-scripts --no-audit --no-fund",
              )
              text = text.replace(
                  "      # The committed lockfile is currently out of sync with package.json.\n"
                  "      # npm install reconciles it in the runner so CI can validate the app.\n"
                  "      # Regenerate and commit package-lock.json locally to restore npm ci.\n",
                  "",
              )
              path.write_text(text)
          PY

      - name: Commit validated lockfile and workflow updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/workflows/repair-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml .github/workflows/deploy.yml .github/workflows/repair-lockfile.yml
          git commit -m "fix: lock npm dependencies for reproducible builds"
          git push origin HEAD:main
